[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "grafana-server-mcp"
version = "0.1.0"
description = "Read-only FastMCP server for Grafana, backed by the gcx CLI"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "fastmcp>=4.2,<5",
    "pydantic>=2.11.0,<3.0",
    "pydantic-settings>=2.7.0,<3.0",
    "structlog>=25.1.0,<27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "ruff>=0.9.0",
    "mypy>=1.15.0",
]

[project.scripts]
grafana-mcp = "grafana_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/grafana_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "I"]
ignore = []

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["grafana_mcp"]

[[tool.mypy.overrides]]
module = ["structlog.*"]
ignore_missing_imports = true
